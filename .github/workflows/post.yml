name: Threads Auto Post

on:
  schedule:
    # 平日（月〜金 JST）※実測遅延1〜2時間を逆算して1時間前倒し
    - cron: '45 19 * * 0-4'  # → 目標 05:00 JST（実測 06:00〜07:00）
    - cron: '45 22 * * 0-4'  # → 目標 08:00 JST（実測 09:00〜10:00）
    - cron: '15 2 * * 1-5'   # → 目標 11:30 JST（実測 12:30〜13:00）
    - cron: '45 7 * * 1-5'   # → 目標 17:00 JST（実測 18:00〜19:00）
    - cron: '45 10 * * 1-5'  # → 目標 20:00 JST（実測 21:00〜22:00）
    - cron: '45 12 * * 1-5'  # → 目標 22:00 JST（実測 23:00〜翌0:00）
    # 土日（JST）
    - cron: '15 21 * * 5,6'  # → 目標 06:30 JST（実測 07:30〜08:00）
    - cron: '15 1 * * 0,6'   # → 目標 10:30 JST（実測 11:30〜12:30）
    - cron: '45 4 * * 0,6'   # → 目標 14:00 JST（実測 15:00〜16:00）
    - cron: '45 8 * * 0,6'   # → 目標 18:00 JST（実測 19:00〜20:00）
    - cron: '45 11 * * 0,6'  # → 目標 21:00 JST（実測 22:00〜23:00）
  workflow_dispatch:  # GAS手動トリガーも引き続き使用可

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run post script
        timeout-minutes: 2
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u skills/queue/post.py

      - name: Commit queue update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/queue/post-queue.md skills/queue/post-history.md skills/queue/post-log.txt skills/queue/last-post-hash.txt skills/queue/urgent-post.md
          git diff --cached --quiet || git commit -m "chore: update post queue"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push失敗（試行${i}回目）。5秒後にリトライ..."
            sleep 5
          done