name: Threads Auto Post

on:
  # スケジュールは Google Apps Script (gas_scheduler.gs) が JST で管理し
  # workflow_dispatch をトリガーする。cron による時差ズレを廃止。
  workflow_dispatch:

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run post script
        timeout-minutes: 2
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u skills/queue/post.py

      - name: Commit queue update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/queue/post-queue.md skills/queue/post-history.md skills/queue/post-log.txt skills/queue/last-post-hash.txt skills/queue/urgent-post.md
          git diff --cached --quiet || git commit -m "chore: update post queue"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push失敗（試行${i}回目）。5秒後にリトライ..."
            sleep 5
          done