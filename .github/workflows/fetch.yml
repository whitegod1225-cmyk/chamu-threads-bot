name: Threads Fetch Metrics

on:
  schedule:
    - cron: '0 15 * * *'   # JST 0:00 毎日深夜に取得
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run fetcher script
        timeout-minutes: 3
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u skills/queue/fetcher.py

      - name: Run analyst script
        run: python -u skills/queue/analyst.py

      - name: Commit metrics update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/queue/post-history.md skills/queue/analysis-latest.md skills/queue/next-topics.md
          git diff --cached --quiet || git commit -m "chore: update metrics and next topics"
          git pull --rebase origin main
          git push

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[fetch失敗] ${today} メトリクス取得エラー`,
              body: `## fetch.yml が失敗しました\n\n**日時**: ${today}\n\n**よくある原因**:\n- THREADS_ACCESS_TOKEN が期限切れ（60日で失効）\n- Threads API の一時障害\n\n**対処**:\n1. [Threads Developers Dashboard](https://developers.facebook.com/apps/) で新しいトークンを取得\n2. このリポジトリの Secrets → \`THREADS_ACCESS_TOKEN\` を更新\n3. Actions タブから fetch.yml を手動実行して確認\n\n[Actions ログを確認](https://github.com/${context.repo.owner}/${context.repo.repo}/actions)`,
              labels: ["bug"]
            });
